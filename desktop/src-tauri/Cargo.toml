[package]
name = "agent-avatar"
version = "1.0.0"
edition = "2021"
[lib]
name = "agent_avatar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
